<title>Plano de Manutenção LOC Frotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f4;--surface:#ffffff;--surface2:#f6f8fa;--ink:#16202a;--muted:#5a6773;--line:#dbe1e7;
  --navy:#011842;--amber:#FEAC00;--accent:#FEAC00;--accent-ink:#011842;--accent-text:#935a00;--accent-soft:#fdf0d9;
  --diesel:#2c5a86;--diesel-soft:#e3ecf5;--flex:#3a7349;--flex-soft:#e3f0e6;--hyb:#6a4f9c;--hyb-soft:#ece6f6;
  --crit:#b42318;--crit-soft:#fdecea;--ok:#2f7a45;
  --troca:#935a00;--insp:#2c5a86;--reg:#6a4f9c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0e141a;--surface:#161f28;--surface2:#1b2631;--ink:#e5eaef;--muted:#91a0ad;--line:#27333f;
  --accent:#FEAC00;--accent-ink:#011842;--accent-text:#FEAC00;--accent-soft:#37290f;
  --diesel:#7fb0e0;--diesel-soft:#1b2c3d;--flex:#86c697;--flex-soft:#18301f;--hyb:#b9a3e6;--hyb-soft:#2a2340;
  --crit:#f2877b;--crit-soft:#3b1d1a;--ok:#86c697;--troca:#FEAC00;--insp:#7fb0e0;--reg:#b9a3e6;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0e141a;--surface:#161f28;--surface2:#1b2631;--ink:#e5eaef;--muted:#91a0ad;--line:#27333f;
  --accent:#FEAC00;--accent-ink:#011842;--accent-text:#FEAC00;--accent-soft:#37290f;
  --diesel:#7fb0e0;--diesel-soft:#1b2c3d;--flex:#86c697;--flex-soft:#18301f;--hyb:#b9a3e6;--hyb-soft:#2a2340;
  --crit:#f2877b;--crit-soft:#3b1d1a;--ok:#86c697;--troca:#FEAC00;--insp:#7fb0e0;--reg:#b9a3e6;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#ffffff;padding-inline:16px;border-bottom:3px solid var(--amber)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand img{width:38px;height:38px;border-radius:8px;flex:none}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;opacity:.65;margin-left:10px;text-transform:none}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{background:transparent;border:0;padding:7px 12px;border-radius:6px;cursor:pointer;color:inherit;opacity:.7;font-weight:500}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);opacity:1}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.side-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}
.fuelf{display:flex;gap:4px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:3px 9px;border-radius:999px;font-size:12px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mlist{overflow:auto;padding:6px 6px 10px}
.mgroup{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:9px 8px;font-weight:600;border-radius:6px;margin-top:2px}
.mgroup:hover{background:var(--surface2);color:var(--ink)}
.mgroup .chev{width:14px;height:14px;flex:none;transition:transform .15s ease}
.mgroup[aria-expanded="true"] .chev{transform:rotate(90deg)}
.mgroup[aria-expanded="true"]{color:var(--ink)}
.mgroup .gname{flex:1}
.mgroup .gcount{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--muted);font-weight:400}
.gbody{padding-left:10px;display:grid}
.gbody[hidden]{display:none}
.mitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer}
.mitem:hover{background:var(--surface2)}
.mitem[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mitem .nm{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-Diesel{background:var(--diesel)}.d-Flex,.d-Gasolina{background:var(--flex)}.d-Híbrido{background:var(--hyb)}
.acount{font-family:var(--mono);font-size:11px;color:var(--crit);min-width:16px;text-align:right}
.mobile-pick{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.p-Diesel{background:var(--diesel-soft);color:var(--diesel)}.p-Flex,.p-Gasolina{background:var(--flex-soft);color:var(--flex)}.p-Híbrido{background:var(--hyb-soft);color:var(--hyb)}
.mhead{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.sub code{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.interval{display:inline-flex;gap:8px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;width:max-content;max-width:100%;flex-wrap:wrap}
.interval b{font-family:var(--mono);font-weight:500;font-size:16px;color:var(--accent-text)}
section{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fact{background:var(--surface);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:12px 14px;display:grid;gap:3px;align-content:start}
.fact .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fact .v{font-family:var(--mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.fact .n{font-size:12px;color:var(--muted)}
.fact .line+.line{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.na{color:var(--muted);font-style:italic;font-family:var(--sans);font-size:13px;font-weight:400}
.alerts{background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:10px;padding:12px 16px}
.alerts h3{margin:0 0 6px;font-size:13px;color:var(--crit);text-transform:uppercase;letter-spacing:.07em}
.alerts ul{margin:0;padding-left:18px;display:grid;gap:4px}
.km-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.kmb{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.kmb:hover{border-color:var(--accent)}
.kmb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rev-col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rev-col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.rev-col h4 span{font-family:var(--mono)}
.rev-col.t h4{color:var(--troca)}.rev-col.i h4{color:var(--insp)}.rev-col.r h4{color:var(--reg)}
.rev-col ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.rev-col li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:5px}
.rev-col li:last-child{border-bottom:0}
.rev-col li em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.finder{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.finder-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.finder-row .search{flex:1;min-width:0;max-width:420px}
.finder-row .hint{font-size:12px;color:var(--muted)}
.qchips{display:flex;gap:4px;flex-wrap:wrap}
.hits{display:grid;gap:10px}
.hit{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.hit-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.hit-name{font-weight:600;font-size:15px}
.hit-name small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.hit-rule{font-family:var(--mono);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.hit-rule .big{font-size:18px;font-weight:500;color:var(--troca)}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cell{border:1px solid var(--line);border-radius:5px;padding:4px 2px;text-align:center;font-family:var(--mono);font-size:10.5px;line-height:1.25;color:var(--muted);background:var(--surface2);cursor:pointer}
.cell b{display:block;font-size:11px;font-weight:600}
.cell.T{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell.I{background:var(--diesel-soft);border-color:color-mix(in srgb,var(--insp) 40%,transparent);color:var(--insp)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.hit-note{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--surface2);position:sticky;top:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--surface2);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;padding-top:12px}
.tk{color:var(--troca);font-weight:500}.ik{color:var(--insp)}.rk{color:var(--reg)}
.txt{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em}
.comp{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.comp span{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.obs{color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{font-weight:600}
.cmp-sel{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;max-width:100%}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-text);cursor:pointer;font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.q-card h4{margin:0 0 6px;display:flex;justify-content:space-between;gap:10px}
.q-card ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 4px}
.stat .v{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.stat .k{font-size:12px;color:var(--muted)}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.gen ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:90ch}
.empty{padding:18px;color:var(--muted)}
@media (max-width:620px){.strip{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .mobile-pick{display:grid;gap:8px;margin-bottom:16px}
  .tabs{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    html+=`<button class="mgroup" aria-expanded="${open}" data-brand="${esc(br)}">${CHEV}<span class="gname">${esc(br)}</span><span class="gcount">${ms.length}</span></button><div class="gbody" ${open?'':'hidden'}>`;
    ms.forEach(d=>{ html+=`<button class="mitem" data-id="${d.id}" aria-current="${d.id===cur}"><span class="dot d-${fuelKey(d.fuel)}" title="${esc(d.fuel)}"></span><span class="nm">${esc(d.nome)}</span>${d.alertas.length?`<span class="acount" title="Alertas de consistência">${d.alertas.length}</span>`:''}</button>`; });
    html+='</div>';
  });
  $('#mlist').innerHTML = html || '<div class="empty">Nenhum modelo encontrado.</div>';
  $('#mlist').querySelectorAll('.mitem').forEach(b=>b.onclick=()=>select(b.dataset.id));
  $('#mlist').querySelectorAll('.mgroup').forEach(b=>b.onclick=()=>{ const br=b.dataset.brand; openBrands.has(br)?openBrands.delete(br):openBrands.add(br); renderList(); });
}
function select(id){ cur=id; const m=DATA.find(x=>x.id===id); if(m) openBrands.add(m.marca); km=null; try{history.replaceState(null,'','#'+id);}catch(e){} renderList(); renderModel(); window.scrollTo({top:0}); }

/* ---------- model helpers ---------- */
const find = (d, re) => d.items.filter(x => re.test(low(x.d)));
function factLines(rows, fn){ return rows.length ? rows.map(r=>`<div class="line">${fn(r)}</div>`).join('') : '<span class="na">Não consta na planilha</span>'; }
function trocaTxt(r){
  const parts=[];
  if (r.t!=null) parts.push(typeof r.t==='number' ? 'troca '+fmtKm(r.t)+' km' : 'troca: '+esc(r.t));
  if (r.i!=null) parts.push('inspeção '+fmtKm(r.i)+' km');
  return parts.join(' · ');
}
function buildFacts(d){
  const oil = find(d,/^oleo\s+motor/);
  const cambio = find(d,/transmiss|trasmiss/).filter(r=>r.e||r.v);
  const dif = find(d,/diferencial|transferencia/);
  const sinc = find(d,/correia dentada|corrente|kit corrente/);
  const velas = find(d,/^velas?|vela de igni/);
  const freio = find(d,/^fluido de freio/);
  const bat = find(d,/^bateria/);
  const dir = find(d,/direcao hidraulica|direcao eletrica/);
  const pas = find(d,/pastilha/);
  const f = [];
  f.push(['Óleo do motor', factLines(oil, r=>`<div class="v">${esc(r.e||'—')} · ${fmtV(r.v)||'—'}</div><div class="n">${trocaTxt(r)}${r.o?' · '+esc(r.o):''}</div>`)]);
  f.push(['Câmbio', factLines(cambio, r=>`<div class="v">${esc(r.e||'s/ espec.')} · ${fmtV(r.v)||'—'}</div><div class="n">${esc(r.d)}<br>${trocaTxt(r)||'sem intervalo'}</div>`)]);
  if (dif.length) f.push(['Diferencial / transferência', factLines(dif, r=>`<div class="v">${esc(r.e||'—')} · ${fmtV(r.v)||'—'}</div><div class="n">${esc(r.d)}<br>${trocaTxt(r)||'sem intervalo'}</div>`)]);
  f.push(['Sincronismo', factLines(sinc, r=>`<div class="v" style="font-size:14px">${esc(r.d)}</div><div class="n">${trocaTxt(r)}</div>`)]);
  if (d.fuel!=='Diesel') f.push(['Velas', factLines(velas, r=>`<div class="v">${esc(r.e||'—')}</div><div class="n">${trocaTxt(r)}</div>`)]);
  f.push(['Fluido de freio', factLines(freio, r=>`<div class="v">${esc(r.e||'—')} · ${fmtV(r.v)||'—'}</div><div class="n">${trocaTxt(r)}${r.o?' · '+esc(r.o):''}</div>`)]);
  f.push(['Pastilha de freio', factLines(pas, r=>`<div class="v">${typeof r.t==='number'?fmtKm(r.t)+' km':esc(r.t||'—')}</div><div class="n">${trocaTxt(r)}</div>`)]);
  f.push(['Bateria', factLines(bat, r=>`<div class="v">${esc(r.e||'s/ espec.')}</div><div class="n">${esc(r.d)} · ${trocaTxt(r)}</div>`)]);
  f.push(['Direção', factLines(dir, r=>`<div class="v" style="font-size:14px">${esc(r.e||r.d)}${r.v?' · '+fmtV(r.v):''}</div><div class="n">${esc(r.d)} · ${trocaTxt(r)||'sem intervalo'}${r.o?' · '+esc(r.o):''}</div>`)]);
  f.push(['Torque de roda', d.torque.length ? d.torque.map(t=>`<div class="line"><div class="v" style="font-size:14px">${esc(t[1]||'')}</div><div class="n">Porca ${esc(t[0])}</div></div>`).join('') : '<span class="na">Não consta na aba</span>']);
  return f.map(([k,v])=>`<div class="fact"><div class="k">${k}</div>${v}</div>`).join('');
}
function revisao(d, K){
  const T=[],I=[],R=[];
  d.items.forEach(r=>{
    const t=parseKm(r.t), i=parseKm(r.i), g=parseKm(r.r);
    if (t && K % t === 0) T.push(r);
    else if (i && K % i === 0) I.push(r);
    if (g && K % g === 0) R.push(r);
  });
  const li = (r,extra) => `<li><span>${esc(r.d)}</span><em>${extra}</em></li>`;
  const col = (cls, title, arr, fn) => `<div class="rev-col ${cls}"><h4>${title}<span>${arr.length}</span></h4>${arr.length?`<ul>${arr.map(fn).join('')}</ul>`:'<div class="na">Nada nesta revisão</div>'}</div>`;
  return `<div class="rev">
    ${col('t','Trocar',T,r=>li(r,[r.e,r.v!=null?fmtV(r.v):''].filter(Boolean).join(' · ')))}
    ${col('i','Inspecionar',I,r=>li(r,''))}
    ${R.length?col('r','Regular',R,r=>li(r,'')):''}
  </div>`;
}
function renderRev(d){
  const kms=[]; for(let k=d.base;k<=d.base*12;k+=d.base) kms.push(k);
  if (km==null || !kms.includes(km)) km = kms[3] || kms[0];
  $('#kmrow').innerHTML = kms.map(k=>`<button class="kmb" aria-pressed="${k===km}" data-k="${k}">${fmtKm(k)}</button>`).join('');
  $('#kmrow').querySelectorAll('button').forEach(b=>b.onclick=()=>{km=+b.dataset.k;renderRev(d);});
  $('#revout').innerHTML = revisao(d, km);
  $('#revkm').textContent = fmtKm(km)+' km';
  renderFinder(d);
}
let iq='';
const QUICK=['Óleo motor','Filtro','Pastilha','Disco','Correia','Velas','Fluido de freio','Câmbio','Bateria','Alinhamento'];
function finderMatch(d,q){
  const n=low(q).trim(); if(!n) return [];
  const words=n.split(/\s+/);
  const alias={cambio:'transmiss',oleo:'oleo',freio:'freio'};
  return d.items.filter(r=>{const s=low(r.d+' '+(r.e||'')); return words.every(w=>s.includes(alias[w]||w) || (w==='cambio'&&s.includes('trasmiss')));});
}
function renderFinder(d){
  const kms=[]; for(let k=d.base;k<=d.base*12;k+=d.base) kms.push(k);
  const hits=finderMatch(d,iq);
  const box=$('#hits');
  $('#qchips').innerHTML=QUICK.map(q=>`<button class="chipbtn" aria-pressed="${low(q)===low(iq)}" data-q="${q}">${q}</button>`).join('');
  $('#qchips').querySelectorAll('button').forEach(b=>b.onclick=()=>{iq= low(iq)===low(b.dataset.q)?'':b.dataset.q; $('#iq').value=iq; renderFinder(d);});
  if(!iq.trim()){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  if(!hits.length){ box.innerHTML='<div class="na">Nenhum item com esse nome no plano deste modelo.</div>'; return; }
  box.innerHTML=hits.map(r=>{
    const t=parseKm(r.t), i=parseKm(r.i);
    const rule=[];
    if(t) rule.push(`<span>Trocar a cada <span class="big">${fmtKm(t)} km</span></span>`);
    else if(r.t!=null) rule.push(`<span>Troca: <b class="tk">${esc(r.t)}</b></span>`);
    else rule.push('<span class="na">Sem troca programada</span>');
    if(i) rule.push(`<span class="ik">Inspecionar a cada ${fmtKm(i)} km</span>`);
    const g=parseKm(r.r); if(g) rule.push(`<span class="rk">Regular a cada ${fmtKm(g)} km</span>`);
    const cells=kms.map(k=>{ const c = t&&k%t===0?'T':(i&&k%i===0?'I':''); return `<div class="cell ${c} ${k===km?'sel':''}" data-k="${k}" title="${fmtKm(k)} km"><b>${k/1000}k</b>${c==='T'?'troca':c==='I'?'insp.':'—'}</div>`; }).join('');
    const spec=[r.e,r.v!=null?fmtV(r.v):''].filter(Boolean).join(' · ');
    return `<div class="hit"><div class="hit-top"><div class="hit-name">${esc(r.d)}<small>${esc(r.g)}</small></div><div class="hit-rule">${rule.join('')}</div></div>
      ${(t||i)?`<div class="strip">${cells}</div>`:''}
      ${spec||r.o?`<div class="hit-note">${spec?'Especificação: '+esc(spec):''}${spec&&r.o?' · ':''}${r.o?esc(r.o):''}</div>`:''}</div>`;
  }).join('');
  box.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{km=+c.dataset.k;renderRev(d);});
}
let tFilter='todos';
function renderTable(d){
  const q = low($('#tq')?.value||'');
  let rows = d.items.filter(r=> !q || low(r.d+' '+(r.e||'')+' '+(r.o||'')+' '+(r.s||[]).join(' ')).includes(q));
  if (tFilter==='troca') rows = rows.filter(r=>r.t!=null);
  if (tFilter==='insp') rows = rows.filter(r=>r.t==null && (r.i!=null||r.r!=null));
  const order=[]; rows.forEach(r=>{ if(!order.includes(r.g)) order.push(r.g); });
  let html='';
  order.forEach(g=>{
    html+=`<tr class="grp"><td colspan="7">${esc(g)}</td></tr>`;
    rows.filter(r=>r.g===g).forEach(r=>{
      html+=`<tr><td><div>${esc(r.d)}</div>${r.s&&r.s.length?`<details><summary>${r.s.length} componentes</summary><div class="comp">${r.s.map(c=>`<span>${esc(c)}</span>`).join('')}</div></details>`:''}</td>
      <td class="num">${cellKm(r.t,'tk')}</td><td class="num">${cellKm(r.i,'ik')}</td><td class="num">${cellKm(r.r,'rk')}</td>
      <td class="num">${esc(r.e||'')}</td><td class="num">${fmtV(r.v)}</td><td class="obs">${esc(r.o||'')}</td></tr>`;
    });
  });
  $('#tbody').innerHTML = html || '<tr><td colspan="7" class="empty">Nenhum item com esse filtro.</td></tr>';
}
function renderModel(){
  const d = DATA.find(x=>x.id===cur);
  const extra = d.extra.length ? `<div class="sub">${d.extra.map(esc).join(' · ')}</div>` : '';
  $('#model').innerHTML = `
    <div class="mobile-pick">
      <select id="mpick" class="cmp-sel" aria-label="Escolher modelo">${DATA.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${esc(x.marca)} · ${esc(x.nome)}${x.alertas.length?' ('+x.alertas.length+' alertas)':''}</option>`).join('')}</select>
    </div>
    <div class="mhead">
      <div class="eyebrow">${esc(d.marca)} <span class="pill p-${fuelKey(d.fuel)}">${esc(d.fuel)}</span></div>
      <h1>${esc(d.nome)}</h1>
      <div class="sub">Aba <code>${esc(d.aba)}</code> · Cabeçalho da planilha: “${esc(d.titulo)}”</div>
      ${extra}
      <div class="interval"><span>Revisão preventiva a cada</span><b>${fmtKm(d.base)} km</b><span>ou 12 meses, o que ocorrer primeiro</span></div>
    </div>
    ${d.alertas.length?`<div class="alerts"><h3>Conferir antes de usar · ${d.alertas.length}</h3><ul>${d.alertas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
    <section><div class="sec-h"><h2>Ficha rápida</h2></div><div class="facts">${buildFacts(d)}</div></section>
    <section>
      <div class="sec-h"><h2>O que fazer na revisão de <span id="revkm"></span></h2><span class="sub">Calculado pelos intervalos da planilha</span></div>
      <div class="finder">
        <div class="finder-row">
          <input id="iq" class="search" type="search" list="ilist" placeholder="Consultar item: pastilha, correia, óleo, velas…" aria-label="Consultar item">
          <datalist id="ilist"></datalist>
          <span class="hint">Mostra com quantos km o item é trocado ou inspecionado</span>
        </div>
        <div class="qchips" id="qchips"></div>
        <div class="hits" id="hits" hidden></div>
      </div>
      <div class="km-row" id="kmrow"></div>
      <div id="revout"></div>
    </section>
    <section>
      <div class="sec-h"><h2>Plano completo</h2>
        <div class="tools">
          <input id="tq" class="search" style="width:220px;max-width:100%" type="search" placeholder="Filtrar itens" aria-label="Filtrar itens">
          <div class="fuelf" id="tf"></div>
        </div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>Item</th><th>Troca (km)</th><th>Inspeção (km)</th><th>Regular (km)</th><th>Especificação</th><th>Volume</th><th>Observação</th></tr></thead>
        <tbody id="tbody"></tbody></table></div>
    </section>`;
  $('#mpick').onchange = e => select(e.target.value);
  const tf=[['todos','Todos'],['troca','Com troca'],['insp','Só inspeção']];
  const drawTf=()=>{ $('#tf').innerHTML=tf.map(([k,l])=>`<button class="chipbtn" aria-pressed="${k===tFilter}" data-k="${k}">${l}</button>`).join('');
    $('#tf').querySelectorAll('button').forEach(b=>b.onclick=()=>{tFilter=b.dataset.k;drawTf();renderTable(d);}); };
  drawTf();
  $('#tq').oninput = ()=>renderTable(d);
  const names=[...new Set(d.items.map(r=>(r.d||'').trim()))].filter(Boolean);
  $('#ilist').innerHTML=names.map(n=>`<option value="${esc(n)}"></option>`).join('');
  $('#iq').value=iq;
  $('#iq').oninput=e=>{iq=e.target.value;renderFinder(d);};
  renderRev(d); renderTable(d);
}

$('#q').oninput = renderList;
openBrands.add(DATA.find(x=>x.id===cur).marca);
renderFuel(); renderList(); renderModel();
